# Kio Frontend — nginx site config (single-page app)
#
# The one rule this file exists for is the `try_files ... /index.html` fallback
# in `location /`. Kio uses React Router's BrowserRouter, so /student,
# /verify-email and /reset-password are client-side routes with no file on
# disk. Without the fallback, every deep link 404s — including the links Kio
# emails people for verification and password reset.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx patch version.
    server_tokens off;

    # Uploads are not a feature yet; keep the accepted body small.
    client_max_body_size 2m;

    # --- Compression ------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/manifest+json;

    # --- Security headers -------------------------------------------
    # `always` so they are still sent on error responses.
    add_header X-Content-Type-Options   "nosniff"                always;
    add_header X-Frame-Options          "DENY"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # HSTS. Only meaningful once TLS terminates in front of this container;
    # harmless if it does not, because browsers ignore it over plain http.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy.
    #
    # Every source below is here because something in the app genuinely needs
    # it. The deliberate exceptions, and why each is not simply removed:
    #
    #   script-src 'self' https://accounts.google.com
    #       Google Identity Services is loaded on demand by src/lib/google.ts
    #       for Sign in with Google. No 'unsafe-inline' and no 'unsafe-eval':
    #       the Vite production build emits external module files only, so an
    #       inline-script allowance would buy nothing and cost the main
    #       protection this header provides.
    #
    #   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
    #       'unsafe-inline' is required, not preferred. React sets inline
    #       style attributes for animation and layout, and Recharts renders
    #       inline styles on every SVG element. Removing it breaks the charts
    #       on the parent and school dashboards. The risk it carries is style
    #       injection, not script execution.
    #
    #   connect-src
    #       The API origin and, when configured, the Sentry ingest endpoint.
    #       __API_ORIGIN__ is substituted at container start; if you serve the
    #       API from another host, that host must appear here or every request
    #       fails with a console error and no network activity.
    #
    #   frame-src https://accounts.google.com
    #       The Google sign-in flow renders in an iframe.
    #
    #   object-src 'none'; base-uri 'self'; frame-ancestors 'none'
    #       Kio is never framed, loads no plugins, and nothing may rewrite the
    #       document base to redirect relative URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' __API_ORIGIN__ https://accounts.google.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS is intentionally NOT set here: TLS terminates at the platform load
    # balancer in every supported deployment, and that is where HSTS belongs.
    # Setting it on a plain-HTTP origin behind a proxy is either a no-op or,
    # if this container is ever exposed directly, a self-inflicted outage.

    # --- Container healthcheck --------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Hashed build assets ----------------------------------------
    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # --- index.html -------------------------------------------------
    # Must never be cached: it carries the <script src> pointing at the current
    # hashed bundle. A stale index.html sends returning users to a bundle that
    # no longer exists after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # --- SPA fallback -----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Errors -----------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
