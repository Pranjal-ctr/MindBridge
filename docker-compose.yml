# Kio — full stack in one command.
#
#   cp .env.docker.example .env      # fill in secrets
#   docker compose up --build
#   docker compose run --rm api seed # demo data (refuses if ENVIRONMENT=production)
#
# Frontend on http://localhost:8080, API on http://localhost:8000.
#
# This is a complete single-box deployment and a faithful local mirror of one.
# What it is NOT is a managed-Postgres substitute: the `db` service below has no
# automated backups, no point-in-time recovery, and no failover. For anything
# holding real student data, drop this service and point DATABASE_URL at a
# managed instance — see docs/deployment.md.

services:
  # -----------------------------------------------------------------
  # PostgreSQL
  # -----------------------------------------------------------------
  db:
    image: postgres:15.8-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mindbridge}
    volumes:
      - kio_pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback so the database is reachable from the host for
      # psql/pg_dump but never from the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mindbridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------
  # FastAPI backend (runs `alembic upgrade head` on start)
  # -----------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # Wait for real readiness, not just container start — otherwise the
        # entrypoint's `alembic upgrade` races Postgres's first boot.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mindbridge}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Kio <onboarding@resend.dev>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # See docker-entrypoint.sh for why this defaults to 1.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "${API_PORT:-8000}:8000"

  # -----------------------------------------------------------------
  # Static frontend behind nginx
  # -----------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only — see the note at the top of ./Dockerfile. Changing
        # these requires `docker compose build web`, not a restart.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      # Runtime, not build-time: substituted into the CSP's connect-src so the
      # browser is permitted to call the API. Must match the origin the bundle
      # was built against, or every request is blocked before it is sent.
      API_ORIGIN: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  kio_pgdata:
